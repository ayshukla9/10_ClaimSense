{% extends "base.html" %}
{% block title %}Manage -- ClaimSense{% endblock %}
{% block content %}
<div class="page-header"><h1>Manage bills</h1><p>Staff only: filter the full list or add a bill.</p></div>
<form method="get" class="filter-bar" role="search">
    <div class="field field--grow"><label for="manage-q">Reference #</label>
    <input id="manage-q" name="q" value="{{ q }}" placeholder="reference #"></div>
    <button>Filter</button>
</form>
<section class="card">
<h2 style="margin-top:0">Add a bill</h2>
<form method="post" class="stack-form">{% csrf_token %}
    {{ form.as_p }}
    <button>Create bill</button>
</form>
</section>
<h2>Bills</h2>
{% include "claims/_bill_table.html" %}
{% endblock %}
