{% load static %}
<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1">
</head>
<body>

        <h1>Claim<span>Sense</span></h1>

        <a href="{% url 'claims:bill-summary' %}">Summary</a>

        <a href="{% url 'claims:bill-manage' %}">Manage</a>

    <main>

</body>
</html>
