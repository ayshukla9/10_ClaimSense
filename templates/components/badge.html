{% comment %}
Status badge. Always pair color with text.
Usage: {% include "components/badge.html" with tone="danger" text="Out of network" help="Why this matters" %}
tone: ok | warn | danger | info (omit for neutral). help (optional) becomes a hover tooltip.
{% endcomment %}<span class="badge{% if tone %} badge-{{ tone }}{% endif %}"{% if help %} title="{{ help }}"{% endif %}>{{ text }}</span>
